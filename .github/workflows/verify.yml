# 上游漂移与门禁自检。
#
# 存在理由：内置的技能副本（skills/agent-notes）是上游
# czm15053/write-notes-like-deepseek 的 vendored 拷贝。上游改规则时，
# 副本不会自己跟进 —— 而**没有任何机制会告诉你它落后了**。
# 没有 CI 时，`npm run sync:check` 只比对钉死的 commit，永远返回「一致」，
# 那是一条恒绿的门禁：检查存在、不验证任何东西。
#
# 本工作流做两件事：
#   1. 逐文件比对内置副本与上游默认分支，落后就让 job 变红；
#   2. 跑完整自检（verify + notes:gate + test + 故障注入 + 实机证据）。
name: verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 上游更新不会触发我们的事件，只能定期主动查。
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 是笔记覆盖门禁需要的：它要拿 base sha 做 diff，
      # 默认的 depth 1 拿不到上一个 commit，门禁会退化成「查不到」而报 2。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 装开发依赖。此前本仓库零依赖，这一步不需要；现在有了 devDependencies
      # （spdx-expression-parse，用于校验许可证标识符），不装的话
      # tools/notices.test.mjs 会因解析不到包而整片失败 —— 实测红过一次。
      # 用 npm ci 而非 npm install：前者严格按 package-lock.json 安装，
      # 才能保证 CI 与本地的依赖树一致。
      - name: 安装依赖
        run: npm ci

      # 完整自检：包清单、patch 一致性、零依赖、双语文档、vendored 哈希、
      # 客户端 bundle 同步、投影与命令名一致性，然后跑测试与故障注入。
      # notes:gate 单独列出来：三条 vendored 脚本在空集合上 exit 0，
      # 外壳负责把「没有可验对象」判成失败（见 .agents/notes 里那篇 process 笔记）。
      #
      # 拆成多步（不是一条 &&）：CI 曾出现「本地全绿、CI 报 vendored 文件是旧版」，
      # 拆开后哪一步让摘要变了在日志里一目了然，不必再靠猜。
      - name: 包自检
        run: npm run verify

      - name: 笔记门禁
        run: npm run notes:gate

      # 覆盖门禁：该写笔记的改动必须同批带笔记。
      #
      # 上面那条 notes:gate 只验「已写的笔记格式对不对」，从不检查
      # 「该写而没写」—— 本仓库连续 5 次改 CI 流程却一篇没写，就是这么漏的。
      #
      # 本地有 commit-msg 钩子先拦一道，但钩子可被 --no-verify 绕过，
      # 所以远端这一道才是权威（实测 --no-verify 确实能绕过本地钩子）。
      #
      # 取 base sha：push 事件用 before（上一个 HEAD），PR 用 base.sha，
      # 手动触发没有 base 就退化成只查 HEAD 这一个提交。
      - name: 笔记覆盖门禁
        env:
          NOTES_COVERAGE_BASE: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
        run: |
          if [ -z "$NOTES_COVERAGE_BASE" ] || \
             [ "$NOTES_COVERAGE_BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "没有可用的 base sha，改为只检查 HEAD 这一个提交。"
            node tools/notes-coverage.mjs --range HEAD~1..HEAD
          else
            node tools/notes-coverage.mjs --range "$NOTES_COVERAGE_BASE..HEAD"
          fi

      # supersession 检查：新增笔记必须声明与既有笔记的关系。
      #
      # 规则借鉴 deepseek-ai/deepseek-harness 的 .agents/notes/AGENTS.md：
      #   Every new Agent Note triggers a supersession check.
      #
      # 本仓库原先完全没有这个机制 —— 实测 11 篇笔记只有 3 篇有互链。
      # 不是作者懒，而是没有任何东西提醒他去看。笔记越多，重复的决定
      # 与已过期的结论就越多，而没有人会发现这一行。
      #
      # 只查 base..HEAD 里**新增**的笔记（修改既有笔记本来就有归属）。
      - name: supersession 检查
        env:
          NOTES_SUPERSESSION_BASE: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
        run: |
          if [ -z "$NOTES_SUPERSESSION_BASE" ] || \
             [ "$NOTES_SUPERSESSION_BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "没有可用的 base sha，改为只检查 HEAD 这一个提交。"
            node tools/notes-supersession.mjs --range HEAD~1..HEAD
          else
            node tools/notes-supersession.mjs --range "$NOTES_SUPERSESSION_BASE..HEAD"
          fi

      # 文档预算：AGENTS.md / README 的字数上限。
      #
      # 借鉴 deepseek-harness 的 doc-budgets.manifest.json。理由不是「简洁好看」，
      # 而是这些文件每次改动都会吸收一句「顺便补上」，而没有任何东西阻止它们
      # 增长 —— 实测本仓库 AGENTS.md 在一天内从 148 词涨到 275 词。
      # 没有上限时它会变成没人读完、也没人敢删的长文（删它需要判断哪些还成立，
      # 成本高到没人做）。预算把「该不该加这一句」从模糊自觉变成一次明确取舍。
      #
      # ★ 预算刻意贴近当前值（只留几十的余量）：下一次「顺便补一句」就会触发。
      # ★ 中文按字计、英文按词计 —— 按 `wc -w` 会严重低估中文文档的增长。
      - name: 文档预算
        run: npm run doc:budget

      # ── 以下五道门禁是后来加的，本地 check 链里有，CI 一度一道都没跑 ──
      #
      # 实测踩过：连续三轮加了 notices / md:links / docs:bilingual /
      # text:integrity / release:check 五道门禁，全都只接进了本地 `npm run check`，
      # CI 的 verify job 没同步。后果是**它们红过时 CI 毫无反应** ——
      # 本地成了唯一防线，而本地会被人 `--no-verify`、也会忘记跑。
      #
      # 为什么不用一句 `npm run check` 收尾（那样永远不会漏）：
      #   ① 拆开是为了「哪一步让摘要变了在日志里一目了然」（本文件上方已说明）；
      #   ② `notes:coverage:last` / `supersession:last` 查的是 HEAD~1..HEAD，
      #      CI 用 `github.event.before..HEAD` 更准（覆盖整个 push 的所有提交），
      #      所以那两步**刻意不接**这条链 —— 它们在上面已有独立步骤。
      #
      # 所以这里逐个列出**只跑本地、不依赖 git 范围**的那几道。
      # 判据：凡是判据只依赖「当前文件内容」的门禁都该进 CI；凡是需要
      # 「本次变更范围」的（coverage / supersession）走上面各自的步骤。
      - name: 第三方归属声明
        run: npm run notices:check

      - name: Markdown 链接
        run: npm run md:links

      - name: 双语文档结构
        run: npm run docs:bilingual

      # 把双语文档之间「指错语言」的互链改回来（语言切换器那行不动，
      # 与上游 skipTargets 同口径）。当前仓库零改动 —— 它是防御性完备。
      - name: 双语互链
        run: npm run docs:fix-links

      - name: 文本完整性
        run: npm run text:integrity

      - name: 发版记账
        run: npm run release:check

      # 这道门禁检查的正是「上面这些步骤有没有被漏进 CI」——
      # 包括它自己。放在最后一步，所以它红时能指出「本 job 缺了什么」。
      # 它把自己也列进判据：漏掉自己同样该被报出来。
      - name: 门禁对齐（CI 与本地 check 链一致）
        run: npm run ci:align

      # 跑测试前后各打一次摘要，并在测试后**断言 vendored 目录没被改**。
      #
      # 这不是临时排查残留，是针对一类真实缺陷的永久门禁：
      # 测试跑的是插件真实代码，任何 fire-and-forget 的副作用（如
      # scheduleSkillUpdate 拉远端覆盖技能副本）都可能在测试结束后仍在写盘。
      # 实测发生过：CI 检出后 vendored 是新的，跑完 npm test 变成旧的，
      # 随后的 sync-upstream --check 报「变更 6」整片变红 —— 而本地因为
      # .synced-version 存在、CDN 也已是新版，从不复现，极难查。
      # 把「测试不得改动工作区」变成显式断言，下次一眼就能看见。
      - name: 测试前的 vendored 摘要
        run: |
          echo "== 测试前 =="
          sha256sum skills/agent-notes/SKILL.md
          node -e "const m=require('./tools/upstream-manifest.json');console.log('清单记录:', m.files['SKILL.md'])"

      - name: 行为测试
        run: npm test

      - name: 测试不得改动工作区
        if: always()
        run: |
          echo "== 测试后 =="
          sha256sum skills/agent-notes/SKILL.md
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::测试改动了工作区 —— 说明有测试把副作用写到了真实目录。"
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi
          echo "✔ 工作区干净，测试没有写到真实目录"

      - name: 故障注入
        run: npm run gate:fault-injection

  upstream-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 逐文件比对内置副本与上游默认分支。
      # 退出码：0=一致，1=落后（真红），2=无法核对（网络/限流）。
      # 2 也必须让 job 变红 —— 否则「查不到」会被当成「没问题」。
      - name: 上游是否已漂移
        run: npm run sync:latest
