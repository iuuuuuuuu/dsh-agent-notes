# 上游漂移与门禁自检。
#
# 存在理由：内置的技能副本（skills/agent-notes）是上游
# czm15053/write-notes-like-deepseek 的 vendored 拷贝。上游改规则时，
# 副本不会自己跟进 —— 而**没有任何机制会告诉你它落后了**。
# 没有 CI 时，`npm run sync:check` 只比对钉死的 commit，永远返回「一致」，
# 那是一条恒绿的门禁：检查存在、不验证任何东西。
#
# 本工作流做两件事：
#   1. 逐文件比对内置副本与上游默认分支，落后就让 job 变红；
#   2. 跑完整自检（verify + notes:gate + test + 故障注入 + 实机证据）。
name: verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 上游更新不会触发我们的事件，只能定期主动查。
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 完整自检：包清单、patch 一致性、零依赖、双语文档、vendored 哈希、
      # 客户端 bundle 同步、投影与命令名一致性，然后跑测试与故障注入。
      # notes:gate 单独列出来：三条 vendored 脚本在空集合上 exit 0，
      # 外壳负责把「没有可验对象」判成失败（见 .agents/notes 里那篇 process 笔记）。
      #
      # 拆成多步（不是一条 &&）：CI 曾出现「本地全绿、CI 报 vendored 文件是旧版」，
      # 拆开后哪一步让摘要变了在日志里一目了然，不必再靠猜。
      - name: 包自检
        run: npm run verify

      - name: 笔记门禁
        run: npm run notes:gate

      # 跑测试前后各打一次摘要：用来定位「是否有测试在后台改写 vendored 副本」。
      # 这次是排查手段，成本几毫秒，留着当下次同类问题的仪表。
      - name: 测试前的 vendored 摘要
        run: |
          echo "== 测试前 =="
          sha256sum skills/agent-notes/SKILL.md
          node -e "const m=require('./tools/upstream-manifest.json');console.log('清单记录:', m.files['SKILL.md'])"

      - name: 行为测试
        run: npm test

      - name: 定位写到 vendored 的测试（并行 + 记录时序）
        if: always()
        run: |
          # 已知：测试前 bb76d4d → 测试后 0e6628c，且逐文件串行、
          # 两组最小并行都干净 —— 只有「全部并行」时才发生。
          # 用 inotify 抓到写入时刻，同时把每个测试文件的开始/结束时间打出来，
          # 时间窗对得上就能确定是哪个文件（及其子进程）。
          git checkout -- skills/agent-notes 2>/dev/null || true
          echo "== 起止时间基线 =="
          date -u +%H:%M:%S.%N
          ( command -v inotifywait >/dev/null && \
            inotifywait -m -e modify,create,moved_to --timefmt '%H:%M:%S' \
              --format '%T %w%f' skills/agent-notes 2>/dev/null | \
            while read -r line; do echo "WRITE $line"; done ) &
          WATCH=$!
          sleep 1
          npm test 2>&1 | grep -E "^(not ok|ok) " | head -0 || true
          echo "npm test 结束: $(date -u +%H:%M:%S.%N)"
          sleep 1
          kill $WATCH 2>/dev/null || true
          echo "== 最终摘要 =="
          sha256sum skills/agent-notes/SKILL.md

      - name: 逐文件定位污染源
        if: always()
        run: |
          # 已经确认：测试前 SKILL.md 是 bb76d4d（与清单一致），
          # 测试后变成 0e6628c（旧版），即 npm test 期间真实副本被改写。
          # 这里逐个测试文件单独跑，每跑完一个就记一次摘要，
          # 第一个让摘要变了的文件就是污染源。
          for f in tools/*.test.mjs; do
            git checkout -- skills/agent-notes 2>/dev/null || true
            node --test "$f" >/dev/null 2>&1 || true
            SUM=$(sha256sum skills/agent-notes/SKILL.md | cut -c1-16)
            echo "$(basename "$f") -> $SUM"
          done
          echo "== 上面全部干净的话，说明是并行竞态；再验最小组合 =="
          git checkout -- skills/agent-notes 2>/dev/null || true
          node --test tools/self-update.test.mjs tools/project-skill.test.mjs >/dev/null 2>&1 || true
          echo "self-update + project-skill 并行 -> $(sha256sum skills/agent-notes/SKILL.md | cut -c1-16)"
          git checkout -- skills/agent-notes 2>/dev/null || true
          node --test tools/self-update.test.mjs tools/sync-upstream.test.mjs >/dev/null 2>&1 || true
          echo "self-update + sync-upstream 并行 -> $(sha256sum skills/agent-notes/SKILL.md | cut -c1-16)"
          echo "== 谁在测试期间写过这个文件：看 mtime =="
          git checkout -- skills/agent-notes 2>/dev/null || true
          npm test >/dev/null 2>&1 || true
          stat -c '%y %n' skills/agent-notes/SKILL.md || true

      - name: 测试后的 vendored 摘要
        if: always()
        run: |
          echo "== 测试后 =="
          sha256sum skills/agent-notes/SKILL.md
          echo "== git 视角的改动 =="
          git status --porcelain || true
          git --no-pager diff --stat || true

      - name: 故障注入
        run: npm run gate:fault-injection

  upstream-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 逐文件比对内置副本与上游默认分支。
      # 退出码：0=一致，1=落后（真红），2=无法核对（网络/限流）。
      # 2 也必须让 job 变红 —— 否则「查不到」会被当成「没问题」。
      - name: 上游是否已漂移
        run: npm run sync:latest
